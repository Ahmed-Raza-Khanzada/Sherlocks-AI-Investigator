<!doctype html>
<!--
  Sherlocks embedded in a host page, without Laravel - to check the browser side works.

  Open this file in a browser on a PC that can reach the Sherlocks server, paste a token
  from make-token.php below, and search 99999-0000001-1 (demo data).

  The whole Sherlocks page (markup, styles, scripts) comes from the server through
  embed.js, exactly as in the Laravel tab, so this file never needs updating when
  Sherlocks changes.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sherlocks · Link Graph (test)</title>
</head>
<body>
  <div id="sherlocksRoot"></div>

  <script>
    window.SHERLOCKS_CONFIG = {
      embedded: true,
      backend: 'demo',   // test with synthetic data; the real tab uses 'ems'
      apiBase: 'http://192.168.200.239:7401/sindhpolice-sherlocks',   // in Laravel: $sherlocksApiBase
      token: 'PASTE-A-TOKEN-FROM-make-token.php',                       // in Laravel: $sherlocksToken
      savedRun: null,
      onRunStarted(runId) { console.log('Sherlocks run started', runId); },
      // The finished run (graph, params, stats, log). The Laravel tab POSTs it to be saved.
      onRunComplete(run) { console.log('Sherlocks run complete', run.id, run.graph.nodes.length, 'nodes'); },
      // Token expired (they are short-lived): the Laravel tab fetches a fresh one.
      async onTokenExpired() { return null; },
    };
  </script>
  <script src="http://192.168.200.239:7401/sindhpolice-sherlocks/portal/embed.js"></script>
</body>
</html>
