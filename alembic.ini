# Alembic configuration for Sherlocks.
#
# The database URL is NOT set here: migrations/env.py reads it from Sherlocks settings
# (SHERLOCKS_DATABASE_URL / .env), so there is one place to configure a deployment and
# no credential ever lands in this file.

[alembic]
script_location = %(here)s/src/sherlocks/db/migrations
prepend_sys_path = %(here)s/src
path_separator = os
version_path_separator = os
# Filled in at runtime by env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
